<style>
:root{--bg:#f1f2ee;--card:#fff;--fg:#1b2620;--mut:#667068;--line:#dde1d9;--acc:#2f7a47;--ink:#1f3a2b;--tint:#e5ebe3;--gold:#e0a82e;--gt:#f6e8b8;--band:#1f3a2b;--r:10px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1410;--card:#171f19;--fg:#e8eee8;--mut:#8c998f;--line:#263029;--acc:#5dbb83;--ink:#5dbb83;--tint:#1c2820;--gold:#e6b34a;--gt:#3a3216;--band:#173324;color-scheme:dark}button.p,nav button.mid .mi{color:#07140c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.v{position:fixed;inset:0 0 calc(64px + env(safe-area-inset-bottom,0px)) 0;overflow:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 28px;display:none}
.v.on{display:block}
.v>*{max-width:680px;margin-left:auto;margin-right:auto}
#v-mapa{padding:0;overflow:hidden}
#v-mapa>*{max-width:none;margin-left:0;margin-right:0}
h1{font:700 1.9rem/1.1 "Bricolage Grotesque","Public Sans",system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 18px}
.v>h1:first-child{max-width:none;margin:calc(-22px - env(safe-area-inset-top,0px)) -18px 18px;padding:calc(26px + env(safe-area-inset-top,0px)) 18px 20px;background:var(--band);color:#f4f2e8;font-size:2.2rem;border-bottom:4px solid var(--gold)}
h2{font:700 1.05rem/1.2 "Bricolage Grotesque","Public Sans",system-ui,sans-serif;color:var(--fg);margin:28px 0 8px}
.card{background:var(--card);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:12px 16px;min-height:46px;font-weight:600;font-size:.95rem;cursor:pointer;transition:background .15s,opacity .15s}
button:active{opacity:.7}
button.p{background:var(--gold);border-color:var(--gold);color:#1d2a20}
button.d{color:#b3402f;background:transparent}
button.d[aria-label]{border:0;padding:10px}
input,select,textarea{width:100%;padding:12px 14px;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:.84rem;font-weight:600;color:var(--mut);margin-top:14px}
label>input,label>select,label>textarea{margin-top:6px;font-weight:400}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut);font-size:.88rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;color:#fff;font-weight:600;font-size:.82rem}
.it{display:flex;gap:12px;align-items:center;width:100%;padding:13px 2px;border-bottom:1px solid var(--line)}
button.it{text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;font-weight:400;margin:0}
.rw{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
.rw button.it{border-bottom:0}
#lg{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:12px;z-index:900;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.78rem;font-weight:600;display:none;max-height:40%;overflow:auto}
#rp{position:fixed;inset:0;z-index:3000;background:#fff;color:#111;overflow:auto;padding:18px;display:none;font-size:13px}
#rp h1{font-size:1.4rem;color:#111;margin:10px 0}
#rp h2{color:#111;margin:18px 0 6px;font-size:1rem}
#rp table{width:100%;border-collapse:collapse;margin:6px 0 10px}
#rp th,#rp td{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left;font-size:12px}
#rp th{background:#f1f3f0}
#rp .lg{display:inline-block;margin:2px 12px 2px 0}
@media print{body>*:not(#rp){display:none!important}#rp{position:static;overflow:visible;padding:0}.noprint{display:none!important}#rp h2{break-after:avoid}#rp table{break-inside:auto}#rp tr{break-inside:avoid}}
.seg{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;background:var(--tint);padding:3px;border-radius:10px;margin:0 0 16px}
.seg button{flex:1 0 auto;white-space:nowrap;border:0;background:transparent;padding:9px 12px;min-height:40px;border-radius:8px;font-size:.85rem;color:var(--mut)}
.seg button.on{background:var(--band);box-shadow:none;color:#f4f2e8}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th{background:var(--band);color:#e4ece2;font-weight:600;font-size:.72rem;text-align:left;padding:9px 7px;white-space:nowrap}
.tbl td{padding:9px 7px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--tint) 40%,transparent)}
.tbl .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;background:var(--gt)}
.tbl tr.cl{cursor:pointer}
.tbl input[type=checkbox]{width:auto;margin:0}
.tbl input.pd{width:70px;padding:7px 8px}
.tbl button.d{padding:6px}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px;border-radius:8px;background:var(--tint);color:var(--fg);font-size:.88rem;font-weight:600}
.chk input{width:auto;margin:0}
.it .n{min-width:42px;height:42px;border-radius:10px;font:700 1.05rem "Bricolage Grotesque","Public Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.it .g{flex:1;min-width:0;line-height:1.35}
.it .g b{font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;color:#fff;font-weight:600;font-size:.78rem}
.big{font:700 2rem/1.1 "Bricolage Grotesque","Public Sans",system-ui,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
summary{cursor:pointer;list-style:none;font-size:.95rem}
summary::-webkit-details-marker{display:none}
summary::before{content:"";display:inline-block;width:7px;height:7px;margin:0 12px 2px 3px;border:solid var(--mut);border-width:0 2px 2px 0;transform:rotate(-45deg);transition:transform .15s}
details[open]>summary::before{transform:rotate(45deg)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.bar>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:1200}
nav button{flex:1;border:0;border-radius:0;background:none;padding:9px 0 6px;font-size:.68rem;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--fg)}
nav button.on svg{background:var(--gold);color:#1d2a20;box-sizing:content-box;padding:4px 16px;margin:-4px 0;border-radius:14px}
nav button.mid .mi{display:flex;align-items:center;justify-content:center;width:60px;height:34px;border-radius:14px;background:var(--band);color:var(--gold)}
nav button.mid .mi svg{width:24px;height:24px;background:none;padding:0;margin:0}
nav button.mid b{font-weight:600}
nav button.mid.on b{color:var(--fg)}
#map{position:absolute;inset:0}
#mt{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:1000;display:flex;gap:8px;pointer-events:none}
#mt button{pointer-events:auto;box-shadow:0 1px 6px rgba(0,0,0,.22)}
#ms{position:absolute;top:calc(66px + env(safe-area-inset-top,0px));right:12px;z-index:900;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:.78rem;font-weight:600;display:none}
#mc{position:absolute;left:12px;right:12px;bottom:12px;z-index:1000;display:none}
#mc .card{box-shadow:0 8px 24px rgba(0,0,0,.28);margin:0}
#bk{position:fixed;inset:0;background:rgba(10,18,13,.45);z-index:1500;display:none}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));z-index:1600;display:none;max-width:700px;margin:auto}
#sh::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 16px}
#sh h1{font-size:1.4rem}
#sh input,#sh select,#sh textarea,#sh .card{background:var(--bg)}
.leaflet-tooltip.pvt{background:#0891b2;border:0;color:#fff;font-weight:700;font-size:12px;padding:2px 7px;box-shadow:none}.leaflet-tooltip.pvt::before{display:none}
details.card>summary{padding:2px 0}
.leaflet-tooltip.lot{background:rgba(0,0,0,.55);border:0;color:#fff;font-size:11px;padding:1px 5px;box-shadow:none}.leaflet-tooltip.lot::before{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.leaflet-tooltip.num{white-space:nowrap;text-align:center;line-height:1.15;background:transparent;border:0;box-shadow:none;color:#fff;font-weight:700;font-size:17px;text-shadow:0 0 3px #000,0 0 3px #000}

/* ---- ajustes visuales ---- */
:root{--mut:#4d5850}
@media(prefers-color-scheme:dark){:root{--mut:#a6b3a9}}
.mut{font-size:.92rem}.chip{font-size:.88rem}.tag{font-size:.85rem}.tbl th{font-size:.8rem}.tbl{font-size:.9rem}
nav button{font-size:.72rem}#lg,#ms{font-size:.85rem}.leaflet-tooltip.lot{font-size:13px}
.v>h1:first-child{font-size:1.7rem;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom-width:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats .big{font-size:2.2rem;color:var(--ink)}
.it .n{position:relative;overflow:hidden}.it .n svg{position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px)}
.it .n span{position:absolute;right:3px;bottom:1px;font-size:.7rem;text-shadow:0 0 3px rgba(0,0,0,.8)}
.empty{text-align:center;padding:28px 18px}.empty b{display:block;font:700 1.2rem "Bricolage Grotesque",system-ui,sans-serif;margin-bottom:6px}.empty p{margin:0 0 16px}
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;z-index:1}.tbl td:first-child{background:var(--card)}.tbl th:first-child{background:var(--band)}
.lgh{cursor:pointer;font-weight:700;margin-bottom:4px}#lg.min>div:not(.lgh){display:none}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.v.on{animation:fi .18s ease-out}#sh{animation:up .22s ease-out}
#v-mapa.on{animation:none}@media(prefers-reduced-motion:reduce){.v.on,#sh{animation:none}}
html[data-hc]{--bg:#fff;--card:#fff;--fg:#000;--mut:#1f2a22;--line:#4a5a4f;--acc:#0b5a2a;--ink:#000;--tint:#e9ece8;--band:#0f2a1c;--gt:#ffe9a0;color-scheme:light}
html[data-hc] body{font-weight:500}html[data-hc] .card{box-shadow:inset 0 0 0 2px var(--line)}
html[data-hc] button.p{color:#1d2a20}html[data-hc] nav button.mid .mi{color:#e0a82e}
.v>h1:first-child{position:relative}.cp{position:absolute;right:14px;bottom:12px;min-height:34px;padding:5px 12px;font-size:.85rem;background:rgba(255,255,255,.14);color:#f4f2e8;border:1px solid rgba(255,255,255,.4)}
label textarea{width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
#wk{display:none}body.wk #wk{display:block;position:fixed;inset:0;overflow:auto;background:var(--bg);color:var(--fg);padding:calc(14px + env(safe-area-inset-top,0px)) 14px 30px;z-index:50}
body.wk nav,body.wk .v{display:none!important}.wkh{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}.wkh b{font-size:1.4rem}
</style>

<script>
const CAR0=[
{id:1,n:'Cereales',i:'🌾',c:['Trigo','Cebada','Avena','Centeno','Maíz','Arroz','Sorgo','Triticale']},
{id:2,n:'Leguminosas',i:'🫘',c:['Guisantes','Veza','Garbanzos','Lentejas','Habas','Alubias','Altramuz','Yeros']},
{id:3,n:'Oleaginosas',i:'🌻',c:['Girasol','Colza','Soja','Cártamo']},
{id:4,n:'Forrajes y praderas',i:'🌿',c:['Alfalfa','Esparceta','Pradera','Ray-grass','Maíz forrajero','Veza-avena']},
{id:5,n:'Hortalizas y tubérculos',i:'🥕',c:['Patatas','Remolacha','Zanahorias','Cebollas','Ajos','Tomates','Pimientos','Lechugas']},
{id:6,n:'Frutales',i:'🍎',c:['Manzano','Peral','Melocotonero','Cerezo','Almendro','Nogal']},
{id:7,n:'Viñedo',i:'🍇',c:['Uva de vino','Uva de mesa']},
{id:8,n:'Olivar',i:'🫒',c:['Olivo']}];
function nrm(t){return (t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
const SING={patata:'Patatas',zanahoria:'Zanahorias',cebolla:'Cebollas',ajo:'Ajos',tomate:'Tomates',pimiento:'Pimientos',lechuga:'Lechugas'};
function iniCult(d){
if(!d.cultivos)d.cultivos=[...new Set((d.carpetas||[]).flatMap(f=>f.c).concat(CAR0.flatMap(f=>f.c)))];
const f=c=>SING[nrm(c)]||c;
d.cultivos=[...new Set(d.cultivos.map(f))].sort((a,b)=>a.localeCompare(b,'es'));
(d.parcels||[]).forEach(p=>{if(p&&p.cultivo)p.cultivo=f(p.cultivo)});
}
const E=['Sin labrar','Arada','Sembrada','Cosechada','Barbecho'];
const C={'Sin labrar':'#8d867f','Arada':'#9333ea','Sembrada':'#16a34a','Cosechada':'#ca8a04','Barbecho':'#0284c7'};

const TT=GR.flatMap(g=>g[1]).concat(['Arada']);
const REN={'Abonado':'Abonar','Tratamiento':'Aplicar fitosanitarios','Cosecha':'Cosechar'};
function migra(d){(d.parcels||[]).forEach(p=>p&&(p.tareas||[]).forEach(t=>{if(t&&REN[t.tipo])t.tipo=REN[t.tipo]}));if(d.tarifas)Object.keys(REN).forEach(k=>{if(d.tarifas[k]){d.tarifas[REN[k]]=d.tarifas[k];delete d.tarifas[k]}})}
const IC={'Arada':'🚜','Vertederas':'🚜','Subsolar':'⛏️','Cultivador':'🔱','Restrojero':'🧹','Grada de discos':'💿','Rotativa':'🌀','Siembra':'🌱','Pasar el rulo':'🛞','Abonar':'🧪','Aplicar fitosanitarios':'🧴','Riego':'💧','Cosechar':'🌾','Segar forraje':'🌿','Hilerar':'〰️','Empacar':'📦','Recoger paja':'🧺','Otro':'📝'};
const TC={'Arada':'#9333ea','Vertederas':'#7e22ce','Subsolar':'#a21caf','Cultivador':'#c026d3','Restrojero':'#db2777','Grada de discos':'#be185d','Rotativa':'#6366f1','Siembra':'#16a34a','Pasar el rulo':'#65a30d','Abonar':'#0d9488','Aplicar fitosanitarios':'#dc2626','Riego':'#0891b2','Cosechar':'#ca8a04','Segar forraje':'#4d7c0f','Hilerar':'#ea580c','Empacar':'#d97706','Recoger paja':'#b45309','Otro':'#6b7280'};
const tag=t=>'<span class="tag" style="background:'+TC[t]+'">'+IC[t]+' '+t+'</span>';
const TRI='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const GC={'Semilla':'#16a34a','Abonos':'#0d9488','Fitosanitarios':'#dc2626','Combustible':'#ea580c','Maquinaria':'#7c3aed','Mano de obra':'#2563eb','Riego':'#0891b2','Seguros e impuestos':'#6b7280','Otros':'#a16207'};
const TG={'Arada':'Maquinaria','Vertederas':'Maquinaria','Subsolar':'Maquinaria','Cultivador':'Maquinaria','Restrojero':'Maquinaria','Grada de discos':'Maquinaria','Rotativa':'Maquinaria','Siembra':'Maquinaria','Pasar el rulo':'Maquinaria','Abonar':'Abonos','Aplicar fitosanitarios':'Fitosanitarios','Riego':'Riego','Cosechar':'Maquinaria','Segar forraje':'Maquinaria','Hilerar':'Maquinaria','Empacar':'Maquinaria','Recoger paja':'Maquinaria','Otro':'Otros'};
const eur=n=>(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const IGC={'Venta de cosecha':'#16a34a','Subvención / PAC':'#2563eb','Otros ingresos':'#a16207'};
const itag=c=>'<span class="tag" style="background:'+(IGC[c]||'#6b7280')+'">'+esc(c)+'</span>';
const sumE=a=>a.reduce((x,g)=>x+g.importe,0);
const benC=b=>'<b style="color:'+(b>=0?'#16a34a':'#dc2626')+'">'+eur(b)+'</b>';

async function muniCode(prov,nom){
const n=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
const r=await fetch('https://ovc.catastro.meh.es/ovcservweb/OVCSWLocalizacionRC/OVCCallejero.asmx/ConsultaMunicipio?Provincia='+encodeURIComponent(n(prov))+'&Municipio='+encodeURIComponent(n(nom)));
if(!r.ok)throw 0;
const x=new DOMParser().parseFromString(await r.text(),'text/xml');
const ms=[...x.getElementsByTagName('muni')];
if(!ms.length)return null;
const nm=q=>q.getElementsByTagName('nm')[0].textContent;
const pk=ms.find(q=>n(nm(q))===n(nom))||ms[0];
const cm=pk.getElementsByTagName('cm')[0];
return cm?{cod:parseInt(cm.textContent,10),nom:nm(pk)}:null;
}
function wkt(w){
const nums=t=>t.trim().split(/\s*,\s*/).map(q=>q.trim().split(/\s+/).slice(0,2).map(Number));
if(/^\s*MULTIPOLYGON/i.test(w)){
const b=w.replace(/^\s*MULTIPOLYGON\s*Z?\s*\(\(\(/i,'').replace(/\)\)\)\s*$/,'');
return{type:'MultiPolygon',coordinates:b.split(/\)\)\s*,\s*\(\(/).map(pl=>pl.split(/\)\s*,\s*\(/).map(nums))};
}
const b=w.replace(/^\s*POLYGON\s*Z?\s*\(\(/i,'').replace(/\)\)\s*$/,'');
return{type:'Polygon',coordinates:b.split(/\)\s*,\s*\(/).map(nums)};
}

async function irA(){
const q=$('pg').value.trim();if(!q)return;
hint('Buscando…');
try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es&q='+encodeURIComponent(q));
const j=await r.json();
if(!j.length){hint('No encuentro ese lugar.');return}
map.setView([+j[0].lat,+j[0].lon],15);hint('Listo. Acerca y toca tu parcela.')}
catch(e){hint('No pude buscar el lugar.')}
}
function irYo(){
if(!navigator.geolocation){hint('Este navegador no da la ubicación.');return}
hint('Buscando tu ubicación…');
navigator.geolocation.getCurrentPosition(q=>{map.setView([q.coords.latitude,q.coords.longitude],17);hint('Estás aquí. Toca tu parcela.')},()=>hint('No pude obtener la ubicación. Revisa el permiso del navegador.'),{enableHighAccuracy:true,timeout:15000});
}
async function cargar(v,m){
const ref=v.join(':');
if(has(ref)){m('Esa parcela ya está en tu lista ('+ref+').');return false}
m('Buscando en el SIGPAC…');
const r=await fetch('https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfoparc/'+v.join('/')+'.json');
if(!r.ok)throw 0;
const j=await r.json();
if(!Array.isArray(j)||!j.length){m('No encuentro la parcela '+ref+' (prov:mun:agr:zona:pol:parc). Revisa los datos o usa «Tocar la parcela en el mapa».');return false}
const gs=[],uso=new Set();let ha=0;
for(const f of j){const g=f.wkt?fixGeom(wkt(f.wkt),f.srid):f.geometry;if(!g)continue;gs.push(g);ha+=Number(f.superficie)||0;if(f.uso_sigpac)uso.add(f.uso_sigpac)}
if(!gs.length){m('El SIGPAC respondió, pero en un formato que no entiendo.');return false}
const co=[];gs.forEach(g=>g.type==='Polygon'?co.push(g.coordinates):g.coordinates.forEach(c=>co.push(c)));
const geom={type:'MultiPolygon',coordinates:co};
if(!ok({geom})){m('El SIGPAC devolvió coordenadas que no sé interpretar (sistema '+j[0].srid+'). No se ha añadido la parcela.');return false}
closeS();
finish(geom,{sigpac:ref,ha:ha?ha.toFixed(4):'',notas:'Uso SIGPAC: '+[...uso].join(', ')+(gs.length>1?' · '+gs.length+' recintos':'')});
return true;
}
async function identify(ll){
hint('Buscando la parcela…');
try{
const r=await fetch('https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfobypoint/4258/'+ll.lng.toFixed(7)+'/'+ll.lat.toFixed(7)+'.json');
if(!r.ok)throw 0;
const j=await r.json();
if(!Array.isArray(j)||!j.length){hint('Ahí no hay ninguna parcela del SIGPAC. Toca dentro de una parcela.');return}
const a=j[0];
if(await cargar([a.provincia,a.municipio,a.agregado,a.zona,a.poligono,a.parcela].map(Number),hint)){pick=false;dui();askTown(a.provincia,a.municipio,ll)}
}catch(e){hint('No se pudo consultar el SIGPAC (¿sin conexión?).')}
}

sheet('<h1>'+(x?'Editar producto':'Nuevo producto')+'</h1><label>Nombre<input id="qn" value="'+esc(x?x.nombre:'')+'" placeholder="Ej.: Glifosato 36%"></label><label>Tipo<select id="qt">'+['Insecticida','Fungicida','Abono','Herbicida'].map(t=>'<option'+(x&&x.tipo===t?' selected':'')+'>'+t+'</option>').join('')+'</select></label><div class="row"><label>Dosis por hectárea<input id="qd" type="number" step="0.01" inputmode="decimal" value="'+(x?x.dosis:'')+'"></label><label>Unidad<select id="qu"><option'+(x&&x.unidad==='kg'?'':' selected')+'>L</option><option'+(x&&x.unidad==='kg'?' selected':'')+'>kg</option></select></label></div><label>Precio por litro o por kilo (€)<input id="qp" type="number" step="0.01" inputmode="decimal" value="'+(x&&x.precio?x.precio:'')+'"></label><label>Cultivos a los que se aplica</label><p class="mut" style="margin:2px 0 6px">Si no marcas ninguno, vale para todos.</p><div class="tg">'+D.cultivos.map(c=>'<label class="chk" style="margin:0"><input type="checkbox" class="pc" value="'+esc(c)+'"'+(x&&x.cultivos.some(k=>norm(k)===norm(c))?' checked':'')+'>'+esc(c)+'</label>').join('')+'</div><div class="bar"><button class="p" id="qsv">Guardar</button>'+(x?'<button class="d" id="qdl">Borrar</button>':'')+'<button onclick="openProd()">Cancelar</button></div>');
$('qsv').onclick=()=>{
const nombre=$('qn').value.trim(),dosis=parseFloat($('qd').value);
if(!nombre){appMsg('Escribe el nombre del producto.');return}
if(!(dosis>0)){appMsg('Escribe la dosis por hectárea.');return}
const o={nombre,tipo:$('qt').value,dosis,unidad:$('qu').value,precio:parseFloat($('qp').value)||0,cultivos:[...document.querySelectorAll('#sh .pc:checked')].map(e=>e.value)};

};
if(x)$('qdl').onclick=async()=>{if(await ask('¿Borrar el producto «'+x.nombre+'»?','Borrar',1)){D.productos=D.productos.filter(q=>q.id!==x.id);save();openProd()}};
}

h+='<div class="tw"><table class="tbl"><thead><tr><th>Fecha</th><th>Parcela</th><th>Producto</th><th class="r">Cantidad</th><th class="r">Coste</th><th></th></tr></thead><tbody>'+
rows.map(r=>'<tr class="cl" onclick="openP('+r.p.id+')"><td>'+fd(r.t.fecha)+'</td><td><span class="dot" style="background:'+col(r.p)+'"></span><b>'+r.p.num+'</b>'+(r.p.cultivo?'<br><span class="mut">'+esc(r.p.cultivo)+'</span>':'')+'</td><td>'+(r.x?'<b>'+esc(r.x.nombre)+'</b><br><span class="mut">'+r.x.dosis+' '+r.x.unidad+'/ha</span>':'<span class="mut">Sin producto</span>')+'</td><td class="r">'+(r.x?(r.x.cant||0).toLocaleString('es-ES')+' '+r.x.unidad:'')+'</td><td class="r">'+(r.imp!=null?eur(r.imp):'—')+'</td><td><button class="d" aria-label="Borrar trabajo" onclick="event.stopPropagation();borrarT('+r.p.id+','+r.t.id+')">'+TRI+'</button></td></tr>').join('')+
'</tbody><tfoot><tr><td colspan="3">Total</td><td class="r">'+qtxt+'</td><td class="r">'+eur(tot)+'</td><td></td></tr></tfoot></table></div>';
return h;
}
async function borrarT(pid,tid){const p=P(pid);if(!p||!(await ask('¿Borrar este trabajo y los gastos que generó?','Borrar',1)))return;p.tareas=p.tareas.filter(t=>t.id!==tid);D.gastos=D.gastos.filter(g=>g.tid!==tid);save();render()}

/* ---- equipo y trabajadores ---- */
var WKO=null,WKD=[],wkT='dia',EQd={w:[],t:[],ts:0};
const EQ=()=>fbDb.collection('equipos').doc(fbUser.uid);
async function eqLoad(){await fbP;const [a,b]=await Promise.all([EQ().collection('trabajadores').get(),EQ().collection('tareas').get()]);EQd.w=a.docs.map(d=>({id:d.id,...d.data()}));EQd.t=b.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.fecha||'').localeCompare(x.fecha||''));EQd.ts=Date.now()}
async function eqRender(force){if(WKO)return;let e=$('eqb');if(!e)return;if(!fbUser){e.innerHTML='<p class="mut" style="margin-top:0">Conecta tu cuenta en «Copia en la nube» para usar el equipo.</p>';return}

e=$('eqb');if(!e)return;
const ET={pendiente:'⏳ Pendiente',hecha:'✅ Hecha, por confirmar',confirmada:'✔ Confirmada'},W=Object.fromEntries(EQd.w.map(w=>[w.id,w.nombre||w.id]));
e.innerHTML='<div class="mut" style="margin-top:0">Tu código de explotación (se lo das al trabajador):</div><div class="card" style="user-select:all;word-break:break-all;margin:6px 0 12px"><b>'+fbUser.uid+'</b></div><b>Trabajadores</b>'+
(EQd.w.map(w=>'<div class="it" style="justify-content:space-between"><span>'+esc(w.nombre||w.id)+' <span class="mut">'+esc(w.id)+'</span></span><button class="d" aria-label="Quitar trabajador" onclick="eqDelW(\''+w.id+'\')">'+TRI+'</button></div>').join('')||'<p class="mut">Aún no has añadido trabajadores.</p>')+
'<div class="row" style="margin-top:8px"><input id="ewn" placeholder="Nombre"><input id="ewe" type="email" placeholder="Correo del trabajador"></div><button class="p" style="width:100%;margin-top:8px" onclick="eqAddW()">Añadir trabajador</button>'+
'<div style="margin-top:16px"><b>Tareas</b> <button onclick="eqRender(true)" aria-label="Actualizar">↻</button></div><button class="p" style="width:100%;margin:8px 0" onclick="eqNewT()">+ Nueva tarea</button>'+
(EQd.t.map(t=>'<div class="card" style="margin:8px 0"><b>'+esc(t.tipo)+'</b> · Parcela '+esc(t.pnum)+(t.pnom?' · '+esc(t.pnom):'')+'<div class="mut">'+fd(t.fecha)+' · '+esc(W[t.wk]||t.wk)+'</div><div>'+(ET[t.estado]||t.estado)+(t.horas?' · '+t.horas+' h':'')+'</div>'+(t.notas?'<div class="mut">Notas: '+esc(t.notas)+'</div>':'')+(t.coment?'<div class="mut">Trabajador: '+esc(t.coment)+'</div>':'')+'<div class="bar" style="margin-top:8px">'+(t.estado==='hecha'?'<button class="p" onclick="eqConf(\''+t.id+'\')">Confirmar y pasar a trabajos</button>':'')+'<button class="d" aria-label="Borrar tarea" onclick="eqDelT(\''+t.id+'\')">'+TRI+'</button></div></div>').join('')||'<p class="mut">No hay tareas.</p>')}
async function eqAddW(){const em=$('ewe').value.trim().toLowerCase(),n=$('ewn').value.trim();if(!/^\S+@\S+\.\S+$/.test(em)){alert('Escribe un correo válido.');return}try{await EQ().collection('trabajadores').doc(em).set({nombre:n,activo:true})}catch(x){alert('No se pudo guardar: '+x.message);return}eqRender(true)}
async function eqDelW(id){if(!(await ask('¿Quitar a '+id+'? Dejará de ver sus tareas.','Quitar',1)))return;await EQ().collection('trabajadores').doc(id).delete();eqRender(true)}
async function eqDelT(id){if(!(await ask('¿Borrar esta tarea?','Borrar',1)))return;await EQ().collection('tareas').doc(id).delete();eqRender(true)}
function eqNewT(){if(!EQd.w.length){alert('Primero añade un trabajador.');return}if(!D.parcels.length){alert('Primero añade una parcela.');return}
sheet('<h1>Nueva tarea</h1><label>Trabajador<select id="etw">'+EQd.w.map(w=>'<option value="'+esc(w.id)+'">'+esc(w.nombre||w.id)+'</option>').join('')+'</select></label><label>Parcela<select id="etp">'+D.parcels.map(p=>'<option value="'+p.id+'">'+p.num+(p.nombre?' · '+esc(p.nombre):'')+'</option>').join('')+'</select></label><label>Trabajo<select id="ett">'+TT.map(t=>'<option>'+esc(t)+'</option>').join('')+'</select></label><label>Fecha<input id="etf" type="date" value="'+hoy()+'"></label><label>Notas<textarea id="etn" rows="3"></textarea></label><div class="bar"><button onclick="closeS()">Cancelar</button><button class="p" onclick="eqSaveT()">Asignar</button></div>')}

async function eqConf(id){const t=EQd.t.find(x=>x.id===id);if(!t)return;const p=D.parcels.find(x=>x.id===t.pid);if(!p){alert('La parcela de esta tarea ya no existe.');return}
if(!(await ask('Se anotará «'+t.tipo+'» en la parcela '+p.num+' con fecha '+fd(t.fecha)+' en la campaña '+campName()+'.','Confirmar')))return;
const tk={id:Date.now(),tipo:t.tipo,fecha:t.fecha,nota:[t.notas,t.coment?'Trabajador: '+t.coment:'',t.horas?t.horas+' h':''].filter(Boolean).join(' · ')};p.tareas.push(tk);
const tr=tarSie(tk.tipo);if(tr&&tr.precio>0){const am=amt(p,tr);if(am>0)D.gastos.push({id:tk.id+1,pid:p.id,cat:TG[tk.tipo]||'Otros',concepto:tk.tipo+' · '+tr.precio+(tr.u==='ha'?' €/ha × '+hap(p).toFixed(2)+' ha':' € por parcela'),importe:am,fecha:tk.fecha,tid:tk.id})}
save();try{await EQ().collection('tareas').doc(id).update({estado:'confirmada'})}catch(x){}render()}
async function wkLogin(){const c=$('wc').value.trim(),em=$('we').value.trim().toLowerCase(),pw=$('wp').value;if(!c||!em||!pw){alert('Rellena código, correo y contraseña.');return}
try{await fbP;try{await fbAuth.signInWithEmailAndPassword(em,pw)}catch(e){if(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential'){try{await fbAuth.createUserWithEmailAndPassword(em,pw)}catch(e2){throw new Error(e2.code==='auth/email-already-in-use'?'Contraseña incorrecta.':e2.message)}}else throw e}
const d=await fbDb.collection('equipos').doc(c).collection('trabajadores').doc(em).get();if(!d.exists){await fbAuth.signOut();throw new Error('Tu jefe aún no te ha añadido con este correo, o el código no es correcto.')}
localStorage.setItem('agro-eq',c);location.reload()}catch(e){alert(e.message)}}

w.innerHTML='<div class="wkh"><b>Mis tareas</b><span><button onclick="wkLoad()" aria-label="Actualizar">↻</button> <button onclick="wkOut()">Salir</button></span></div><div class="bar" style="margin-bottom:10px">'+tb('dia','Hoy')+tb('sem','Semana')+tb('hec','Hechas')+'</div>'+

m('Importando '+(i+1)+' de '+items.length+'…');
if(has(ref)){dup++;continue}
try{
const r=await traer(v);
if(r===null){nf.push(ref+' (no existe)');continue}
if(!r){nf.push(ref+' (formato no reconocido)');continue}
D.parcels.push({id:Date.now()+i,num:D.parcels.reduce((a,p)=>Math.max(a,p.num),0)+1,geom:r.geom,nombre:names[i]||'',sigpac:ref,catastral:'',ha:r.ha,estado:'Sin labrar',cultivo:'',notas:r.notas,tareas:[]});added++;
}catch(e){nf.push(ref+' (error de conexión)')}
}
save();render();
const fallos=nf.concat(bad.map(l=>l+' (formato no válido)'));
m('<b>'+added+' añadidas</b>'+(dup?', '+dup+' ya estaban':'')+(fallos.length?'. No se pudieron importar:<br>'+fallos.map(esc).join('<br>'):'.'));
$('ig').disabled=false;$('ig').textContent='Cerrar';
$('ig').onclick=()=>{closeS();if(added){fitted=true;show('mapa');fitAll()}};
}
function fillMu(){const pr=Number($('pr').value);$('mu').innerHTML='<option value="">— elige el pueblo —</option>'+D.pueblos.filter(t=>t.pr===pr).sort((x,y)=>x.nombre.localeCompare(y.nombre,'es')).map(t=>'<option value="'+t.mu+'">'+esc(t.nombre)+'</option>').join('')}
function pueblosHTML(){
const k=[...new Set(D.parcels.filter(p=>p.sigpac).map(p=>p.sigpac.split(':').slice(0,2).join(':')))].filter(c=>{const[x,y]=c.split(':').map(Number);return !D.pueblos.some(t=>t.pr===x&&t.mu===y)});
return (D.pueblos.map((t,i)=>'<div class="it" style="justify-content:space-between"><span><b>'+esc(t.nombre)+'</b> <span class="mut">'+t.pr+':'+t.mu+'</span></span><button class="d" onclick="delPu('+i+')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>').join('')+
k.map(c=>'<div class="it" style="justify-content:space-between"><span class="mut">Código '+c+' sin nombre</span><button data-k="'+c+'" onclick="nombrar(this.dataset.k)">Poner nombre</button></div>').join('')||'<p class="mut">Aún no hay pueblos guardados. Al añadir una parcela tocando el mapa, la aplicación te preguntará el nombre del pueblo.</p>')+'<button class="p" style="width:100%;margin-top:8px" onclick="openPueblo()">+ Añadir pueblo por nombre</button>';
}
function delPu(i){D.pueblos.splice(i,1);save();render()}
function nombrar(c){const[x,y]=c.split(':').map(Number);const p=D.parcels.find(q=>q.sigpac&&q.sigpac.startsWith(c+':'));askTown(x,y,p&&ok(p)?gb(p).getCenter():null)}
async function askTown(pr,mu,ll){
pr=Number(pr);mu=Number(mu);
if(D.pueblos.some(t=>t.pr===pr&&t.mu===mu))return;
if(!ll){const lp=D.parcels[D.parcels.length-1];if(lp&&ok(lp))ll=gb(lp).getCenter()}
sheet('<h1>¿Cómo se llama este municipio?</h1><p class="mut">Así podrás buscar sus parcelas por nombre. Código SIGPAC: '+pr+':'+mu+'</p><input id="tn2" placeholder="Nombre del pueblo"><div class="bar"><button class="p" id="tg">Guardar</button><button onclick="closeS()">Ahora no</button></div>');
$('tg').onclick=()=>{const n=$('tn2').value.trim();if(n){D.pueblos.push({pr,mu,nombre:n});save()}closeS()};
if(ll){try{const ac=new AbortController();setTimeout(()=>ac.abort(),5000);const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&addressdetails=1&lat='+ll.lat+'&lon='+ll.lng,{signal:ac.signal});const j=await r.json();const a=j.address||{};const nm=a.municipality||a.city||a.town||a.village||'';const e=$('tn2');if(e&&!e.value&&nm)e.value=nm}catch(e){}}
}
function openPueblo(){
const opts=Object.values(CA).join(',').split(',').map(t=>t.match(/^(\d+) (.*)$/)).sort((x,y)=>x[2].localeCompare(y[2],'es')).map(m=>'<option value="'+m[1]+'">'+m[2]+'</option>').join('');
sheet('<h1>Añadir pueblo</h1><label>Provincia<select id="pp">'+opts+'</select></label><label>Nombre del pueblo<input id="pn" placeholder="Ej.: Fuentesaúco" autocomplete="off"></label><div id="pmsg" class="mut" style="min-height:1.4em;margin-top:8px"></div><div class="bar"><button class="p" id="pb">Buscar y guardar</button><button onclick="closeS()">Cerrar</button></div>');
$('pb').onclick=buscarPueblo;
}
async function buscarPueblo(){
const m=t=>$('pmsg').textContent=t;
const nm=$('pn').value.trim(),pn=$('pp').selectedOptions[0].text,pr=Number($('pp').value);
if(!nm){m('Escribe el nombre del pueblo.');return}
m('Localizando el pueblo…');
let c;
try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es&q='+encodeURIComponent(nm+', '+pn));const j=await r.json();if(!j.length){m('No encuentro ese pueblo. Revisa el nombre o la provincia.');return}c={lat:+j[0].lat,lng:+j[0].lon}}
catch(e){m('No pude localizar el pueblo (¿sin conexión?).');return}
m('Buscando parcelas alrededor…');
const d=0.012,ps=[];
for(let i=-2;i<=2;i++)for(let k=-2;k<=2;k++)ps.push([c.lng+k*d,c.lat+i*d]);
const rs=await Promise.all(ps.map(async q=>{try{const r=await fetch('https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfobypoint/4258/'+q[0].toFixed(7)+'/'+q[1].toFixed(7)+'.json');const j=await r.json();return Array.isArray(j)&&j[0]&&Number(j[0].provincia)===pr?Number(j[0].municipio):null}catch(e){return null}}));
const v={};rs.filter(x=>x!==null).forEach(x=>v[x]=(v[x]||0)+1);
const best=Object.entries(v).sort((x,y)=>y[1]-x[1])[0];
if(!best){m('No encontré parcelas cerca de ese pueblo. Usa «Tocar la parcela en el mapa» sobre una de sus fincas.');return}
const mu=Number(best[0]),tot=rs.filter(x=>x!==null).length;
const ex=D.pueblos.find(t=>t.pr===pr&&t.mu===mu);
if(ex){m('Ese municipio ya estaba guardado como «'+ex.nombre+'» (código '+pr+':'+mu+').');return}
D.pueblos.push({pr,mu,nombre:nm});save();render();
m('Guardado: '+nm+' (código '+pr+':'+mu+'; '+best[1]+' de '+tot+' puntos coinciden). '+(Object.keys(v).length>1?'Ojo: hay varios municipios cerca, comprueba con una parcela. ':'')+'Ya puedes elegirlo en la lista.');
}
async function buscar(){
const m=t=>$('msg').textContent=t;
const mu=$('mcod').value.trim()||$('mu').value;
if(!mu){m('Elige el pueblo de la lista. Si es nuevo, usa «Tocar la parcela en el mapa» una vez para que la aplicación lo aprenda.');return}
const v=[$('pr').value,mu,$('ag').value,$('zo').value,$('po').value,$('pa').value].map(x=>parseInt(x,10));
if(v.some(isNaN)){m('Rellena el pueblo, el polígono y la parcela.');return}
try{if(await cargar(v,m))askTown(v[0],v[1])}catch(e){m('No se pudo consultar el SIGPAC (¿sin conexión?). Puedes dibujar la parcela a mano.')}
}
function exportar(){const b=new Blob([JSON.stringify(D)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='parcelas-'+hoy()+'.json';a.click()}
$('imp').onchange=e=>{
const f=e.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=async()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.parcels))throw 0;if(!(await ask('Se reemplazarán los datos actuales por los de la copia. ¿Continuar?','Cargar copia',1)))return;D=j;campInit(D);campOpenLast();if(!D.pueblos)D.pueblos=[];if(!D.gastos)D.gastos=[];if(!D.ingresos)D.ingresos=[];if(!D.carpetas)D.carpetas=JSON.parse(JSON.stringify(CAR0));if(!D.tarifas)D.tarifas={};if(!D.semilla)D.semilla={};migra(D);iniCult(D);sane(D);D.parcels.forEach(p=>{if(!p.tareas)p.tareas=[]});save();render();drawMap();appMsg('Copia cargada.')}catch(x){appMsg('El archivo no es una copia válida.')}};
r.readAsText(f);
};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
let me=null;
function locate(first){
if(!navigator.geolocation){if(first)fitAll();else{msUp('Este navegador no da la ubicación');setTimeout(zUp,3000)}return}
msUp('Buscando tu ubicación…');
navigator.geolocation.getCurrentPosition(q=>{
const ll=[q.coords.latitude,q.coords.longitude];
if(me)map.removeLayer(me);
me=L.layerGroup([L.circle(ll,{radius:Math.min(q.coords.accuracy||30,300),color:'#2563eb',weight:1,fillOpacity:.1}),L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1})]).addTo(map);
map.setView(ll,16);zUp();
},()=>{if(first)fitAll();msUp('No pude obtener tu ubicación');setTimeout(zUp,3000)},{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
}
$('loc').onclick=()=>locate(false);
function fitAll(){const g=D.parcels.filter(ok);if(g.length){try{map.fitBounds(L.featureGroup(g.map(p=>L.geoJSON({type:'Feature',geometry:p.geom}))).getBounds(),{maxZoom:16})}catch(e){}}}
function sane(d){
const dt=/^\d{4}-\d{2}-\d{2}$/,str=v=>v==null?'':String(v);
d.parcels=Array.isArray(d.parcels)?d.parcels.filter(Boolean):[];
d.parcels.forEach((p,i)=>{
p.id=p.id||Date.now()+i;while(d.parcels.some((q,j)=>j<i&&q.id===p.id))p.id++;p.num=Number(p.num)||i+1;
['nombre','cultivo','ha','sigpac','catastral','notas'].forEach(k=>p[k]=str(p[k]));
if(!E.includes(p.estado))p.estado='Sin labrar';
p.pivots=(Array.isArray(p.pivots)?p.pivots:[]).filter(v=>v&&isFinite(v.lat)&&isFinite(v.lng)).map((v,k)=>({id:v.id||Date.now()+k,lat:Number(v.lat),lng:Number(v.lng),r:Math.max(0,Number(v.r)||0),tipo:v.tipo==='aspersor'?'aspersor':'pivot',clip:!!v.clip,full:v.full!==false,a0:Number(v.a0)||0,a1:v.a1==null?90:Number(v.a1)||0}));
p.lotes=(Array.isArray(p.lotes)?p.lotes:[]).filter(l=>l&&typeof l==='object').slice(0,3).map((l,k)=>({id:l.id||Date.now()+k,cultivo:String(l.cultivo||''),ha:Math.max(0,Number(l.ha)||0),estado:E.includes(l.estado)?l.estado:p.estado}));
p.loteDir=['auto','ns','sn','oe','eo'].includes(p.loteDir)?p.loteDir:'auto';
p.tareas=(Array.isArray(p.tareas)?p.tareas:[]).filter(Boolean).map((t,k)=>Object.assign({},t,{id:t.id||Date.now()+k,tipo:TT.includes(t.tipo)?t.tipo:'Otro',fecha:dt.test(t.fecha||'')?t.fecha:hoy(),nota:str(t.nota)}));
});
d.gastos=(Array.isArray(d.gastos)?d.gastos:[]).filter(Boolean).map((g,k)=>Object.assign({},g,{id:g.id||Date.now()+k,pid:Number(g.pid)||0,cat:GC[g.cat]?g.cat:'Otros',concepto:str(g.concepto),importe:Number(g.importe)||0,fecha:dt.test(g.fecha||'')?g.fecha:hoy()}));
if(!Array.isArray(d.pueblos))d.pueblos=[];
d.ingresos=(Array.isArray(d.ingresos)?d.ingresos:[]).filter(Boolean).map((g,k)=>({id:g.id||Date.now()+k,pid:Number(g.pid)||0,cat:IGC[g.cat]?g.cat:'Otros ingresos',concepto:str(g.concepto),kg:Number(g.kg)||0,importe:Number(g.importe)||0,fecha:dt.test(g.fecha||'')?g.fecha:hoy()}));
if(!d.tarifas||typeof d.tarifas!=='object')d.tarifas={};
d.semillas=(Array.isArray(d.semillas)?d.semillas:[]).filter(x=>x&&String(x.nombre||'').trim()).map((x,k)=>({id:x.id||Date.now()+k,nombre:str(x.nombre).trim(),precio:Math.max(0,Number(x.precio)||0)}));
{const q=d.semilla&&typeof d.semilla==='object'?d.semilla:{};d.semilla={kgha:Math.max(0,Number(q.kgha)||0),precio:Math.max(0,Number(q.precio)||0)}}
d.productos=(Array.isArray(d.productos)?d.productos:[]).filter(Boolean).map((x,k)=>({id:x.id||Date.now()+k,nombre:str(x.nombre),tipo:['Insecticida','Fungicida','Abono','Herbicida'].includes(x.tipo)?x.tipo:'Insecticida',dosis:Number(x.dosis)||0,unidad:x.unidad==='kg'?'kg':'L',precio:Number(x.precio)||0,cultivos:Array.isArray(x.cultivos)?x.cultivos.map(str):[]}));
}
function aviso(t){
let e=$('er');
if(!e){e=document.createElement('div');e.id='er';e.style.cssText='position:fixed;left:0;right:0;top:0;z-index:5000;background:#b3402f;color:#fff;padding:10px 14px;font:600 13px system-ui;display:none';e.onclick=()=>{e.style.display='none'};document.body.appendChild(e)}
e.textContent='Ha ocurrido un error: '+t+' (toca para ocultar)';e.style.display='block';
}
window.addEventListener('error',e=>aviso(e.message));
window.addEventListener('unhandledrejection',e=>aviso((e.reason&&e.reason.message)||String(e.reason)));
sane(D);
render();
