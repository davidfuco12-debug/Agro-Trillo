const sw=pivS(v),np=Math.max(1,Math.ceil(sw/120)),res=[];
for(let k=0;k<np;k++){const s0=Number(v.a0)+sw*k/np,s1=Number(v.a0)+sw*(k+1)/np,m=Math.max(2,Math.ceil((s1-s0)/4)),pts=[[0,0]];
for(let i=0;i<=m;i++){const b=(s0+(s1-s0)*i/m)*Math.PI/180;pts.push([v.r*Math.sin(b),v.r*Math.cos(b)])}res.push(pts)}
return res}
function pivClip(v,p){
const g=p.geom,polys=g.type==='MultiPolygon'?g.coordinates:[g.coordinates],f=pivXY(v),rings=[];let m2=0;
const pcs=pivPieces(v);
polys.forEach(pl=>{const loc=pl[0].map(c=>f.to(c[0],c[1]));pcs.forEach(pc=>{const r=shClip(loc,pc);if(r.length>=3){let a=0;for(let i=0;i<r.length;i++){const q=r[i],w=r[(i+1)%r.length];a+=q[0]*w[1]-w[0]*q[1]}m2+=Math.abs(a)/2;rings.push(r.map(q=>f.from(q[0],q[1])))}})});
return{rings,ha:m2/10000}}
const pivA=(v,p)=>(v.clip&&p&&ok(p)&&v.r>0)?pivClip(v,p).ha:pivA0(v);
function pivPoly(v){const pts=[[v.lat,v.lng]],n=Math.max(2,Math.ceil(pivS(v)/4)),k=Math.cos(v.lat*Math.PI/180)||1;
for(let i=0;i<=n;i++){const b=(Number(v.a0)+pivS(v)*i/n)*Math.PI/180;pts.push([v.lat+v.r*Math.cos(b)/111320,v.lng+v.r*Math.sin(b)/(111320*k)])}
return pts}
const pivD=(v,p)=>{if(!(v.r>0))return'Escribe la longitud del pivot para calcular el área';let t=v.full===false?'Radio: '+Number(v.r).toFixed(0)+' m · Giro de '+pivS(v).toFixed(0)+'° (de '+(Number(v.a0)||0)+'° a '+(Number(v.a1)||0)+'°)':'Diámetro: '+(2*v.r).toFixed(0)+' m · Radio: '+Number(v.r).toFixed(0)+' m · Círculo completo';
if(v.clip){if(p&&ok(p)){const a0=pivA0(v);t+=' · Recortado a la parcela'+(a0>0?' ('+Math.round(100*pivA(v,p)/a0)+'% del área teórica)':'')}else t+=' · No se puede recortar: el contorno de la parcela no es válido'}
return t};
const pivH=(v,p)=>v.r>0?pivA(v,p).toFixed(2)+' ha':'—';
const pivLL=v=>Number(v.lat).toFixed(6)+', '+Number(v.lng).toFixed(6);

function pivAdd(pid){const p=P(pid);if(!p)return;fo.set('piv',true);p.pivots=p.pivots||[];const c=ok(p)?gb(p).getCenter():map.getCenter();p.pivots.push({id:Date.now(),lat:c.lat,lng:c.lng,r:0,full:true,a0:0,a1:90,clip:false});save();openP(pid)}

async function muniCode(prov,nom){
const n=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
const r=await fetch('https://ovc.catastro.meh.es/ovcservweb/OVCSWLocalizacionRC/OVCCallejero.asmx/ConsultaMunicipio?Provincia='+encodeURIComponent(n(prov))+'&Municipio='+encodeURIComponent(n(nom)));
if(!r.ok)throw 0;
const x=new DOMParser().parseFromString(await r.text(),'text/xml');
const ms=[...x.getElementsByTagName('muni')];
if(!ms.length)return null;
const nm=q=>q.getElementsByTagName('nm')[0].textContent;
const pk=ms.find(q=>n(nm(q))===n(nom))||ms[0];
const cm=pk.getElementsByTagName('cm')[0];
return cm?{cod:parseInt(cm.textContent,10),nom:nm(pk)}:null;
}
function wkt(w){
const nums=t=>t.trim().split(/\s*,\s*/).map(q=>q.trim().split(/\s+/).slice(0,2).map(Number));
if(/^\s*MULTIPOLYGON/i.test(w)){
const b=w.replace(/^\s*MULTIPOLYGON\s*Z?\s*\(\(\(/i,'').replace(/\)\)\)\s*$/,'');
return{type:'MultiPolygon',coordinates:b.split(/\)\)\s*,\s*\(\(/).map(pl=>pl.split(/\)\s*,\s*\(/).map(nums))};
}
const b=w.replace(/^\s*POLYGON\s*Z?\s*\(\(/i,'').replace(/\)\)\s*$/,'');
return{type:'Polygon',coordinates:b.split(/\)\s*,\s*\(/).map(nums)};
}

async function cargar(v,m){
const ref=v.join(':');
if(has(ref)){m('Esa parcela ya está en tu lista ('+ref+').');return false}
m('Buscando en el SIGPAC…');
const r=await fetch('https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfoparc/'+v.join('/')+'.json');
if(!r.ok)throw 0;
const j=await r.json();
if(!Array.isArray(j)||!j.length){m('No encuentro la parcela '+ref+' (prov:mun:agr:zona:pol:parc). Revisa los datos o usa «Tocar la parcela en el mapa».');return false}
const gs=[],uso=new Set();let ha=0;
for(const f of j){const g=f.wkt?fixGeom(wkt(f.wkt),f.srid):f.geometry;if(!g)continue;gs.push(g);ha+=Number(f.superficie)||0;if(f.uso_sigpac)uso.add(f.uso_sigpac)}
if(!gs.length){m('El SIGPAC respondió, pero en un formato que no entiendo.');return false}
const co=[];gs.forEach(g=>g.type==='Polygon'?co.push(g.coordinates):g.coordinates.forEach(c=>co.push(c)));
const geom={type:'MultiPolygon',coordinates:co};
if(!ok({geom})){m('El SIGPAC devolvió coordenadas que no sé interpretar (sistema '+j[0].srid+'). No se ha añadido la parcela.');return false}
closeS();
finish(geom,{sigpac:ref,ha:ha?ha.toFixed(4):'',notas:'Uso SIGPAC: '+[...uso].join(', ')+(gs.length>1?' · '+gs.length+' recintos':'')});
return true;
}
async function identify(ll){
hint('Buscando la parcela…');
try{
const r=await fetch('https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfobypoint/4258/'+ll.lng.toFixed(7)+'/'+ll.lat.toFixed(7)+'.json');
if(!r.ok)throw 0;
const j=await r.json();
if(!Array.isArray(j)||!j.length){hint('Ahí no hay ninguna parcela del SIGPAC. Toca dentro de una parcela.');return}
const a=j[0];
if(await cargar([a.provincia,a.municipio,a.agregado,a.zona,a.poligono,a.parcela].map(Number),hint)){pick=false;dui();askTown(a.provincia,a.municipio,ll)}
}catch(e){hint('No se pudo consultar el SIGPAC (¿sin conexión?).')}
}

function planoSVG(){
const ps=D.parcels.filter(ok);if(!ps.length)return '';
const poly=g=>g.type==='Polygon'?[g.coordinates]:g.coordinates;
let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
ps.forEach(p=>poly(p.geom).forEach(pl=>pl[0].forEach(c=>{x0=Math.min(x0,c[0]);x1=Math.max(x1,c[0]);y0=Math.min(y0,c[1]);y1=Math.max(y1,c[1])})));
const k=Math.cos((y0+y1)/2*Math.PI/180),W=700,H=480,pd=30;
const sc=Math.min((W-2*pd)/Math.max((x1-x0)*k,1e-9),(H-2*pd)/Math.max(y1-y0,1e-9));
const X=x=>pd+(x-x0)*k*sc,Y=y=>H-pd-(y-y0)*sc;
let h='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;border:1px solid #ccc;background:#f7f8f5">';
ps.forEach(p=>{
let d='';poly(p.geom).forEach(pl=>pl.forEach(r=>{d+='M'+r.map(q=>X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)).join('L')+'Z'}));
h+='<path d="'+d+'" fill="'+colC(p)+'" fill-opacity=".75" stroke="#222" stroke-width="1" fill-rule="evenodd"/>';
const b=poly(p.geom)[0][0],cx=b.reduce((a,q)=>a+q[0],0)/b.length,cy=b.reduce((a,q)=>a+q[1],0)/b.length;
h+='<text x="'+X(cx).toFixed(1)+'" y="'+Y(cy).toFixed(1)+'" font-size="14" font-weight="700" text-anchor="middle" fill="#000" stroke="#fff" stroke-width="3" paint-order="stroke">'+p.num+'</text>';
});
return h+'</svg>';
}

const rd=repData(y),gen=D.gastos.filter(g=>!P(g.pid)&&(!y||g.fecha.startsWith(y)));
const th=D.parcels.reduce((a,p)=>a+hap(p),0),tg=rd.reduce((a,x)=>a+x.tot,0),tgen=gen.reduce((a,g)=>a+g.importe,0);
const tb=(c,rows)=>'<table><tr>'+c.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.join('')+'</table>';
let h='<div class="bar noprint"><button class="p" onclick="window.print()">Imprimir / guardar PDF</button><button onclick="$(\'rp\').style.display=\'none\'">Cerrar</button></div>'+
'<h1>Informe de campaña '+(y||'(todos los años)')+'</h1><p>Generado el '+fdl(hoy())+'. '+D.parcels.length+' parcelas · '+th.toFixed(2)+' ha · Gastos totales: <b>'+eur(tg+tgen)+'</b>'+(th>0?' · Coste por hectárea: <b>'+eur((tg+tgen)/th)+' / ha</b>':'')+'</p>'+
'<h2>Plano por cultivos</h2>'+planoSVG()+'<div>'+cultivos().map(c=>'<span class="lg"><i class="dot" style="background:'+colC({cultivo:c})+'"></i>'+esc(c)+' ('+D.parcels.filter(p=>norm(p.cultivo)===norm(c)).reduce((a,p)=>a+hap(p),0).toFixed(2)+' ha)</span>').join('')+'<span class="lg"><i class="dot" style="background:#8d867f"></i>Sin cultivo</span></div>'+
'<h2>Resumen por parcela</h2>'+tb(['Nº','Nombre','Cultivo','ha','Estado','Gastos','€ / ha'],rd.map(x=>{const a=hap(x.p);return '<tr><td>'+x.p.num+'</td><td>'+esc(x.p.nombre)+'</td><td>'+esc(x.p.cultivo)+'</td><td>'+a.toFixed(2)+'</td><td>'+x.p.estado+'</td><td>'+eur(x.tot)+'</td><td>'+(a>0&&th>0?eur(x.tot/a+tgen/th):'—')+'</td></tr>'}))+(tgen?'<p>Los gastos generales ('+eur(tgen)+') se reparten por hectárea y están incluidos en «€ / ha».</p>':'');
rd.forEach(x=>{if(!x.ts.length&&!x.gs.length)return;
h+='<h2>Parcela '+x.p.num+' '+esc(x.p.nombre)+' · '+esc(x.p.cultivo||'sin cultivo')+(x.p.sigpac?' ('+esc(x.p.sigpac)+')':'')+'</h2>';
if(x.ts.length)h+=tb(['Fecha','Trabajo','Máquina','Nota'],x.ts.map(t=>'<tr><td>'+fdl(t.fecha)+'</td><td>'+esc(t.tipo)+'</td><td>'+esc(t.maq||'')+'</td><td>'+esc([prodTxt(t),t.nota].filter(Boolean).join(' · '))+'</td></tr>'));
if(x.gs.length)h+=tb(['Fecha','Categoría','Concepto','Importe'],x.gs.map(g=>'<tr><td>'+fdl(g.fecha)+'</td><td>'+esc(g.cat)+'</td><td>'+esc(g.concepto)+'</td><td>'+eur(g.importe)+'</td></tr>'))});
if(gen.length)h+='<h2>Gastos generales</h2>'+tb(['Fecha','Categoría','Concepto','Importe'],gen.map(g=>'<tr><td>'+fdl(g.fecha)+'</td><td>'+esc(g.cat)+'</td><td>'+esc(g.concepto)+'</td><td>'+eur(g.importe)+'</td></tr>'));
$('rp').innerHTML=h;$('rp').style.display='block';$('sh').style.display='none';$('bk').style.display='none';

function csv(y){
const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',n=v=>String(v).replace('.',',');
const rows=[['Fecha','Parcela','Nombre','Cultivo','Hectáreas','Tipo','Detalle','Máquina','Importe (€)']];
repData(y).forEach(x=>{const b=[x.p.num,x.p.nombre,x.p.cultivo,n(hap(x.p))];x.ts.forEach(t=>rows.push([t.fecha].concat(b,['Trabajo',t.tipo+(prodTxt(t)?' - '+prodTxt(t):'')+(t.nota?' - '+t.nota:''),t.maq||'',''])));x.gs.forEach(g=>rows.push([g.fecha].concat(b,['Gasto',g.cat+' - '+g.concepto,'',n(g.importe)])))});
D.gastos.filter(g=>!P(g.pid)&&(!y||g.fecha.startsWith(y))).forEach(g=>rows.push([g.fecha,'','General','','','Gasto',g.cat+' - '+g.concepto,'',n(g.importe)]));
const bl=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
a.href=URL.createObjectURL(bl);a.download='informe-'+(y||'todos')+'.csv';a.click();

async function traer(v){
const r=await fetch('https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfoparc/'+v.join('/')+'.json');
if(!r.ok)throw 0;
const j=await r.json();
if(!Array.isArray(j)||!j.length)return null;
const gs=[],uso=new Set();let ha=0;
for(const f of j){const g=f.wkt?fixGeom(wkt(f.wkt),f.srid):f.geometry;if(!g)continue;gs.push(g);ha+=Number(f.superficie)||0;if(f.uso_sigpac)uso.add(f.uso_sigpac)}
const co=[];gs.forEach(g=>g.type==='Polygon'?co.push(g.coordinates):g.coordinates.forEach(c=>co.push(c)));
const geom={type:'MultiPolygon',coordinates:co};
return gs.length&&ok({geom})?{geom,ha:ha?ha.toFixed(4):'',notas:'Uso SIGPAC: '+[...uso].join(', ')+(gs.length>1?' · '+gs.length+' recintos':'')}:undefined;
}
function openImport(){
sheet('<h1>Importar parcelas</h1><p class="mut">Pega las referencias del SIGPAC, una por línea: 49:94:0:0:1:980. También vale solo provincia, municipio, polígono y parcela (49 94 1 980). Usa el código de municipio del SIGPAC, no el nombre.</p><textarea id="il" rows="8" placeholder="49:94:0:0:1:980"></textarea><div id="im" class="mut" style="min-height:1.4em;margin-top:8px"></div><div class="bar"><button class="p" id="ig">Importar</button><button onclick="closeS()">Cancelar</button></div>');
$('ig').onclick=importar;
}
async function importar(){
const m=t=>$('im').innerHTML=t;
const items=[],bad=[];
$('il').value.split(/\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{const a=(l.match(/\d+/g)||[]).map(Number);if(a.length===4)items.push([a[0],a[1],0,0,a[2],a[3]]);else if(a.length===6||a.length===7)items.push(a.slice(0,6));else bad.push(l)});
if(!items.length){m('No he entendido ninguna línea.');return}
$('ig').disabled=true;
let added=0,dup=0;const nf=[];
for(let i=0;i<items.length;i++){
const v=items[i],ref=v.join(':');
m('Importando '+(i+1)+' de '+items.length+'…');
if(has(ref)){dup++;continue}
try{
const r=await traer(v);
if(r===null){nf.push(ref+' (no existe)');continue}
if(!r){nf.push(ref+' (formato no reconocido)');continue}
D.parcels.push({id:Date.now()+i,num:D.parcels.reduce((a,p)=>Math.max(a,p.num),0)+1,geom:r.geom,nombre:'',sigpac:ref,catastral:'',ha:r.ha,estado:'Sin labrar',cultivo:'',notas:r.notas,tareas:[]});added++;
}catch(e){nf.push(ref+' (error de conexión)')}
}
save();render();
const fallos=nf.concat(bad.map(l=>l+' (formato no válido)'));
m('<b>'+added+' añadidas</b>'+(dup?', '+dup+' ya estaban':'')+(fallos.length?'. No se pudieron importar:<br>'+fallos.map(esc).join('<br>'):'.'));
$('ig').disabled=false;$('ig').textContent='Cerrar';
$('ig').onclick=()=>{closeS();if(added){fitted=true;show('mapa');fitAll()}};
}
function fillMu(){const pr=Number($('pr').value);$('mu').innerHTML='<option value="">— elige el pueblo —</option>'+D.pueblos.filter(t=>t.pr===pr).sort((x,y)=>x.nombre.localeCompare(y.nombre,'es')).map(t=>'<option value="'+t.mu+'">'+esc(t.nombre)+'</option>').join('')}
function pueblosHTML(){
const k=[...new Set(D.parcels.filter(p=>p.sigpac).map(p=>p.sigpac.split(':').slice(0,2).join(':')))].filter(c=>{const[x,y]=c.split(':').map(Number);return !D.pueblos.some(t=>t.pr===x&&t.mu===y)});
return (D.pueblos.map((t,i)=>'<div class="it" style="justify-content:space-between"><span><b>'+esc(t.nombre)+'</b> <span class="mut">'+t.pr+':'+t.mu+'</span></span><button class="d" onclick="delPu('+i+')"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>').join('')+
k.map(c=>'<div class="it" style="justify-content:space-between"><span class="mut">Código '+c+' sin nombre</span><button data-k="'+c+'" onclick="nombrar(this.dataset.k)">Poner nombre</button></div>').join('')||'<p class="mut">Aún no hay pueblos guardados. Al añadir una parcela tocando el mapa, la aplicación te preguntará el nombre del pueblo.</p>')+'<button class="p" style="width:100%;margin-top:8px" onclick="openPueblo()">+ Añadir pueblo por nombre</button>';
}
function delPu(i){D.pueblos.splice(i,1);save();render()}
function nombrar(c){const[x,y]=c.split(':').map(Number);const p=D.parcels.find(q=>q.sigpac&&q.sigpac.startsWith(c+':'));askTown(x,y,p&&ok(p)?gb(p).getCenter():null)}
async function askTown(pr,mu,ll){
pr=Number(pr);mu=Number(mu);
if(D.pueblos.some(t=>t.pr===pr&&t.mu===mu))return;
if(!ll){const lp=D.parcels[D.parcels.length-1];if(lp&&ok(lp))ll=gb(lp).getCenter()}
sheet('<h1>¿Cómo se llama este municipio?</h1><p class="mut">Así podrás buscar sus parcelas por nombre. Código SIGPAC: '+pr+':'+mu+'</p><input id="tn2" placeholder="Nombre del pueblo"><div class="bar"><button class="p" id="tg">Guardar</button><button onclick="closeS()">Ahora no</button></div>');
$('tg').onclick=()=>{const n=$('tn2').value.trim();if(n){D.pueblos.push({pr,mu,nombre:n});save()}closeS()};
if(ll){try{const ac=new AbortController();setTimeout(()=>ac.abort(),5000);const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&addressdetails=1&lat='+ll.lat+'&lon='+ll.lng,{signal:ac.signal});const j=await r.json();const a=j.address||{};const nm=a.municipality||a.city||a.town||a.village||'';const e=$('tn2');if(e&&!e.value&&nm)e.value=nm}catch(e){}}
}
function openPueblo(){
const opts=Object.values(CA).join(',').split(',').map(t=>t.match(/^(\d+) (.*)$/)).sort((x,y)=>x[2].localeCompare(y[2],'es')).map(m=>'<option value="'+m[1]+'">'+m[2]+'</option>').join('');
sheet('<h1>Añadir pueblo</h1><label>Provincia<select id="pp">'+opts+'</select></label><label>Nombre del pueblo<input id="pn" placeholder="Ej.: Fuentesaúco" autocomplete="off"></label><div id="pmsg" class="mut" style="min-height:1.4em;margin-top:8px"></div><div class="bar"><button class="p" id="pb">Buscar y guardar</button><button onclick="closeS()">Cerrar</button></div>');
$('pb').onclick=buscarPueblo;
}
async function buscarPueblo(){
const m=t=>$('pmsg').textContent=t;
const nm=$('pn').value.trim(),pn=$('pp').selectedOptions[0].text,pr=Number($('pp').value);
if(!nm){m('Escribe el nombre del pueblo.');return}
m('Localizando el pueblo…');
let c;
try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es&q='+encodeURIComponent(nm+', '+pn));const j=await r.json();if(!j.length){m('No encuentro ese pueblo. Revisa el nombre o la provincia.');return}c={lat:+j[0].lat,lng:+j[0].lon}}
catch(e){m('No pude localizar el pueblo (¿sin conexión?).');return}
m('Buscando parcelas alrededor…');
const d=0.012,ps=[];
for(let i=-2;i<=2;i++)for(let k=-2;k<=2;k++)ps.push([c.lng+k*d,c.lat+i*d]);
const rs=await Promise.all(ps.map(async q=>{try{const r=await fetch('https://sigpac-hubcloud.es/servicioconsultassigpac/query/recinfobypoint/4258/'+q[0].toFixed(7)+'/'+q[1].toFixed(7)+'.json');const j=await r.json();return Array.isArray(j)&&j[0]&&Number(j[0].provincia)===pr?Number(j[0].municipio):null}catch(e){return null}}));
const v={};rs.filter(x=>x!==null).forEach(x=>v[x]=(v[x]||0)+1);
const best=Object.entries(v).sort((x,y)=>y[1]-x[1])[0];
if(!best){m('No encontré parcelas cerca de ese pueblo. Usa «Tocar la parcela en el mapa» sobre una de sus fincas.');return}
const mu=Number(best[0]),tot=rs.filter(x=>x!==null).length;
const ex=D.pueblos.find(t=>t.pr===pr&&t.mu===mu);
if(ex){m('Ese municipio ya estaba guardado como «'+ex.nombre+'» (código '+pr+':'+mu+').');return}
D.pueblos.push({pr,mu,nombre:nm});save();render();
m('Guardado: '+nm+' (código '+pr+':'+mu+'; '+best[1]+' de '+tot+' puntos coinciden). '+(Object.keys(v).length>1?'Ojo: hay varios municipios cerca, comprueba con una parcela. ':'')+'Ya puedes elegirlo en la lista.');
}
async function buscar(){
const m=t=>$('msg').textContent=t;
const mu=$('mcod').value.trim()||$('mu').value;
if(!mu){m('Elige el pueblo de la lista. Si es nuevo, usa «Tocar la parcela en el mapa» una vez para que la aplicación lo aprenda.');return}
const v=[$('pr').value,mu,$('ag').value,$('zo').value,$('po').value,$('pa').value].map(x=>parseInt(x,10));
if(v.some(isNaN)){m('Rellena el pueblo, el polígono y la parcela.');return}
try{if(await cargar(v,m))askTown(v[0],v[1])}catch(e){m('No se pudo consultar el SIGPAC (¿sin conexión?). Puedes dibujar la parcela a mano.')}
}

const r=new FileReader();
r.onload=async()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.parcels))throw 0;if(!(await ask('Se reemplazarán los datos actuales por los de la copia. ¿Continuar?','Cargar copia',1)))return;D=j;if(!D.pueblos)D.pueblos=[];if(!D.gastos)D.gastos=[];if(!D.ingresos)D.ingresos=[];if(!D.carpetas)D.carpetas=JSON.parse(JSON.stringify(CAR0));if(!D.tarifas)D.tarifas={};migra(D);iniCult(D);sane(D);D.parcels.forEach(p=>{if(!p.tareas)p.tareas=[]});save();render();drawMap();appMsg('Copia cargada.')}catch(x){appMsg('El archivo no es una copia válida.')}};
r.readAsText(f);
};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
let me=null;
function locate(first){
if(!navigator.geolocation){if(first)fitAll();else{msUp('Este navegador no da la ubicación');setTimeout(zUp,3000)}return}
msUp('Buscando tu ubicación…');
navigator.geolocation.getCurrentPosition(q=>{
const ll=[q.coords.latitude,q.coords.longitude];
if(me)map.removeLayer(me);
me=L.layerGroup([L.circle(ll,{radius:Math.min(q.coords.accuracy||30,300),color:'#2563eb',weight:1,fillOpacity:.1}),L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1})]).addTo(map);
map.setView(ll,16);zUp();
},()=>{if(first)fitAll();msUp('No pude obtener tu ubicación');setTimeout(zUp,3000)},{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
}

function sane(d){
const dt=/^\d{4}-\d{2}-\d{2}$/,str=v=>v==null?'':String(v);
d.parcels=Array.isArray(d.parcels)?d.parcels.filter(Boolean):[];
d.parcels.forEach((p,i)=>{
p.id=p.id||Date.now()+i;while(d.parcels.some((q,j)=>j<i&&q.id===p.id))p.id++;p.num=Number(p.num)||i+1;
['nombre','cultivo','ha','sigpac','catastral','notas'].forEach(k=>p[k]=str(p[k]));
if(!E.includes(p.estado))p.estado='Sin labrar';
p.pivots=(Array.isArray(p.pivots)?p.pivots:[]).filter(v=>v&&isFinite(v.lat)&&isFinite(v.lng)).map((v,k)=>({id:v.id||Date.now()+k,lat:Number(v.lat),lng:Number(v.lng),r:Math.max(0,Number(v.r)||0),clip:!!v.clip,full:v.full!==false,a0:Number(v.a0)||0,a1:v.a1==null?90:Number(v.a1)||0}));
p.tareas=(Array.isArray(p.tareas)?p.tareas:[]).filter(Boolean).map((t,k)=>Object.assign({},t,{id:t.id||Date.now()+k,tipo:TT.includes(t.tipo)?t.tipo:'Otro',fecha:dt.test(t.fecha||'')?t.fecha:hoy(),nota:str(t.nota)}));
});
d.gastos=(Array.isArray(d.gastos)?d.gastos:[]).filter(Boolean).map((g,k)=>Object.assign({},g,{id:g.id||Date.now()+k,pid:Number(g.pid)||0,cat:GC[g.cat]?g.cat:'Otros',concepto:str(g.concepto),importe:Number(g.importe)||0,fecha:dt.test(g.fecha||'')?g.fecha:hoy()}));
if(!Array.isArray(d.pueblos))d.pueblos=[];
d.ingresos=(Array.isArray(d.ingresos)?d.ingresos:[]).filter(Boolean).map((g,k)=>({id:g.id||Date.now()+k,pid:Number(g.pid)||0,cat:IGC[g.cat]?g.cat:'Otros ingresos',concepto:str(g.concepto),kg:Number(g.kg)||0,importe:Number(g.importe)||0,fecha:dt.test(g.fecha||'')?g.fecha:hoy()}));
if(!d.tarifas||typeof d.tarifas!=='object')d.tarifas={};
d.productos=(Array.isArray(d.productos)?d.productos:[]).filter(Boolean).map((x,k)=>({id:x.id||Date.now()+k,nombre:str(x.nombre),tipo:['Insecticida','Fungicida','Abono','Herbicida'].includes(x.tipo)?x.tipo:'Insecticida',dosis:Number(x.dosis)||0,unidad:x.unidad==='kg'?'kg':'L',precio:Number(x.precio)||0,cultivos:Array.isArray(x.cultivos)?x.cultivos.map(str):[]}));
}
function aviso(t){
let e=$('er');
if(!e){e=document.createElement('div');e.id='er';e.style.cssText='position:fixed;left:0;right:0;top:0;z-index:5000;background:#b3402f;color:#fff;padding:10px 14px;font:600 13px system-ui;display:none';e.onclick=()=>{e.style.display='none'};document.body.appendChild(e)}
e.textContent='Ha ocurrido un error: '+t+' (toca para ocultar)';e.style.display='block';
}
window.addEventListener('error',e=>aviso(e.message));
window.addEventListener('unhandledrejection',e=>aviso((e.reason&&e.reason.message)||String(e.reason)));
sane(D);
render();
